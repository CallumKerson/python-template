# yamllint's default rules, without the document start marker that copier's
# answers file doesn't write, with room for pinned actions
[files]
yaml = ["*.yaml", "*.yml"]

[lint.rules]
anchors = "enable"
braces = "enable"
brackets = "enable"
colons = "enable"
commas = "enable"
document-end = "disable"
document-start = "disable"
empty-lines = "enable"
empty-values = "disable"
float-values = "disable"
hyphens = "enable"
indentation = "enable"
key-duplicates = "enable"
key-ordering = "disable"
new-line-at-end-of-file = "enable"
new-lines = "enable"
octal-values = "disable"
quoted-strings = "disable"
trailing-spaces = "enable"

[lint.rules.comments]
level = "warning"
# Pinned actions have a single space before the version comment
min-spaces-from-content = 1

[lint.rules.comments-indentation]
level = "warning"

[lint.rules.truthy]
level = "warning"
check-keys = false

[lint.rules.line-length]
max = 120
