---
name: Release

on:
  push:
    branches:
      - main

# The GitHub App's token does the writing, so release PRs trigger CI
permissions: {}

env:
  UV_CACHE_DIR: /tmp/.uv-cache
  # uv installs Python outside its cache, so put it somewhere cacheable too
  UV_PYTHON_INSTALL_DIR: /tmp/.uv-python
  MISE_TASK_OUTPUT: keep-order

jobs:
  # Only release what passes CI. Running it on main also saves caches that
  # pull requests can restore
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/.uv-cache
            /tmp/.uv-python
          key: uv-python-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-python-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-python-${{ runner.os }}

      - run: mise run ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: uv cache prune --ci

  release:
    needs: ci
    runs-on: ubuntu-latest
    concurrency: release
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .config/release-please-config.json
          manifest-file: .config/release-please-manifest.json
