project_name:
  type: str
  help: What is your project name?
  default: "{{ _copier_conf.dst_path | basename | lower | replace(' ', '-') }}"
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9\\-]+$')) %}
    project_name must start with a letter, followed one or more letters, digits or dashes all lowercase.
    {% endif %}

project_description:
  type: str
  help: What is your project for?
  default: A cool new Python project

package_name:
  type: str
  default: "{{ project_name | replace('-', '_') }}"
  when: false

author_name:
  type: str
  help: Who is the author?
  default: Callum Kerson

author_email:
  type: str
  help: What is the author's email?
  default: 12272439+CallumKerson@users.noreply.github.com

python_version:
  type: str
  help: What is the minimum Python version?
  default: "3.14"

uv_auto_sync:
  type: bool
  help: Have mise run uv sync automatically?
  default: false

_subdirectory: template
_answers_file: .config/copier-answers.yaml

# Tools and dependencies are written unversioned (e.g. "latest"). The pin task
# fixes only those placeholders to concrete versions, so `copier update` never
# changes versions a project has already pinned.
_tasks:
  - command: git rev-parse --git-dir >/dev/null 2>&1 || git init --quiet
    when: "{{ _copier_operation == 'copy' }}"
  - ["{{ _copier_python }}", "{{ _copier_conf.src_path }}/tasks/pin_placeholders.py"]
  - command: mise exec -- hk install
    when: "{{ _copier_operation == 'copy' }}"
