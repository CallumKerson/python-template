# Written by copier
ignore = [".copier-answers.yaml"]

[files]
yaml = ["*.yaml", "*.yml"]

[rules]
anchors = "enable"
braces = "enable"
brackets = "enable"
colons = "enable"
commas = "enable"
empty-lines = "enable"
hyphens = "enable"
indentation = "enable"
key-duplicates = "enable"
new-line-at-end-of-file = "enable"
new-lines = "enable"
trailing-spaces = "enable"

[rules.comments]
level = "warning"

[rules.comments-indentation]
level = "warning"

[rules.line-length]
max = 120

[rules.truthy]
level = "warning"
check-keys = false
