---
name: Release

on:
  push:
    branches:
      - main

# Queue releases rather than cancel one half-way through
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

permissions: {}

env:
  UV_CACHE_DIR: /tmp/.uv-cache
  # uv installs Python outside its cache, so put it somewhere cacheable too
  UV_PYTHON_INSTALL_DIR: /tmp/.uv-python
  MISE_TASK_OUTPUT: keep-order

jobs:
  # Only release what passes CI. Running it on main also saves caches that
  # pull requests can restore
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v6
        with:
          path: |
            /tmp/.uv-cache
            /tmp/.uv-python
          key: uv-python-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-python-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-python-${{ runner.os }}

      - run: mise run ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: uv cache prune --ci

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Unlike GITHUB_TOKEN, the App's token lets release PRs trigger CI
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .config/release-please-config.json
          manifest-file: .config/release-please-manifest.json
